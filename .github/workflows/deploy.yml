name: Deploy Frontend

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            export PATH=/root/.nvm/versions/node/v24.21.0/bin:$PATH
            cd /root/Leaf-Homeo-care-frontend-

            # Backup .env file
            cp .env .env.backup || true

            # Stash any local changes
            git stash || true

            # Fetch and reset to latest
            git fetch origin
            git reset --hard origin/main

            # Restore .env file
            cp .env.backup .env || true

            # Install and build
            npm ci
            npm run build

            # Copy to web directory (must match nginx root)
            rsync -a --delete dist/ /var/www/leafhomoeocare/
            nginx -t && systemctl reload nginx

            echo "Deployed: $(git log --oneline -1)"
